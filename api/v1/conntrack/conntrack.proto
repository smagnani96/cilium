syntax = "proto3";

import "flow/flow.proto";
import "relay/relay.proto";

package conntrack;

option go_package = "github.com/cilium/cilium/api/v1/conntrack";

// GetStatsRequest is the request of the Observer.GetConntrackStats RPC.
message GetStatsRequest {
    // resolve makes the entries carry the endpoints, services and nodes of
    // their addresses, which cost a lookup each. They are left out otherwise.
    bool resolve = 1;
}

// GetStatsResponse streams the entries themselves, or a status update about
// the node. When served by Hubble Relay, entries from all the nodes are
// aggregated and each node's issues are reported as node statuses.
// Every IndexedEndpoint, IndexedService and IndexedNode referenced by an entry
// is guaranteed to be sent, once, before the entries referencing it.
message GetStatsResponse {
    oneof response_types {
        Entry entry = 1;
        relay.NodeStatusEvent node_status = 2;
        IndexedEndpoint endpoint = 3;
        IndexedService service = 4;
        IndexedNode node = 5;
    }
}

// Entry is an entry from a node's datapath conntrack stats map.
message Entry {
    Key key = 1;
    Value value = 2;
    State state = 3;

    // source_endpoint_index and destination_endpoint_index reference the
    // IndexedEndpoint resolved for the respective IP. They are unset if the
    // endpoint could not be resolved.
    optional uint32 source_endpoint_index = 4;
    optional uint32 destination_endpoint_index = 5;

    // destination_service_index references the IndexedService matching the
    // destination IP and port. It is unset if no service matches.
    optional uint32 destination_service_index = 6;

    // source_node_index and destination_node_index reference the IndexedNode
    // owning the respective IP. They are unset if the IP is not resolved to a
    // node, which is only attempted for those not resolved to a pod.
    optional uint32 source_node_index = 7;
    optional uint32 destination_node_index = 8;
}

// IndexedEndpoint is a resolved endpoint, referenced by index from the entries
// sharing it.
message IndexedEndpoint {
    uint32 index = 1;
    flow.Endpoint endpoint = 2;
}

// IndexedService is a resolved service, referenced by index from the entries
// sharing it.
message IndexedService {
    uint32 index = 1;
    flow.Service service = 2;
}

// IndexedNode is a resolved node, referenced by index from the entries sharing it.
message IndexedNode {
    uint32 index = 1;
    Node node = 2;
}

// Node is a Cilium node, identified by its cluster and name.
// labels are the node labels, as sorted key=value pairs.
message Node {
    string name = 1;
    string cluster = 2;
    repeated string labels = 3;
}

// Key represents the key of a conntrack stats entry.
message Key {
    string source_ip = 1;
    uint32 source_port = 2;
    string destination_ip = 3;
    uint32 destination_port = 4;
    uint32 protocol = 5;
    uint32 flags = 6;
}

// Value represents the value of a conntrack stats entry.
message Value {
    uint64 rx_packets = 1;
    uint64 tx_packets = 2;
    uint64 rx_bytes = 3;
    uint64 tx_bytes = 4;
}

// State is the state of the conntrack entry a stats entry belongs to.
message State {
    bool alive = 1;
}
